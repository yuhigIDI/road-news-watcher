# 除外する表現（スポーツの比喩・軍事等のノイズ）
exclude_patterns:
  - "road to (the )?(final|finals|world cup|olympics|recovery|victory|glory|title|playoffs?)"
  - "\\b(cricket|football|soccer|rugby|tennis|batsman|wicket|goalkeeper|striker|IPL|Premier League)\\b"
  - "\\b(bridge the gap|bridging the gap|on the road to)\\b"
  - "\\b(missile|airstrike|troops|militants?|terror(ist)?)\\b"
  - "\\b(box office|movie|film review|actor|actress|Bollywood)\\b"
  - "(株価|株式市況|為替相場|決算短信)"
  # 新車発表・販売・試乗記事（EV・highway 等の語が混ざってすり抜けやすい）
  - "\\b(dealership|test drive|priced from|price tag|sedan|hatchback|showroom|horsepower|torque|trim level|motor show|auto show|model year)\\b"
