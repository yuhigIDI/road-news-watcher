# 対象国の定義
#   name_en   : Googleニュース英語検索で使う国名
#   name_fr   : 仏語検索も行う国だけ記入（仏語圏アフリカ等）
#   name_ja   : 日本語検索・表示用
#   aliases   : 記事本文から国を判定するための語（国名の別表記、首都・主要都市、道路機関の略称など）
#               英字は単語境界で照合、日本語はそのまま部分一致
#   gn        : Googleニュースの地域版（hl:gl）。現地媒体が拾いやすくなる。未指定は en-US:US

regions:
  ASEAN:
    - {code: ID, name_ja: インドネシア, name_en: Indonesia, gn: "en:ID",
       aliases: [Indonesian, Jakarta, Surabaya, Bandung, Medan, Nusantara, Jasa Marga, Bina Marga, BPJT, Danantara, ジャカルタ, スラバヤ, ヌサンタラ]}
