# 収集元の設定

# 何日前までの記事を対象にするか（毎日実行なら 2〜3 日で十分。初回は 7 などにしてもよい）
lookback_days: 3

# Googleニュース検索（国ごとに下のテンプレートで検索）
#   {country} には countries.yaml の name_en / name_fr / name_ja が入ります
google_news:
  enabled: true
  sleep_seconds: 1.5
  en_queries:
    - '"{country}" (road OR highway OR expressway OR motorway OR bridge OR flyover OR toll OR tunnel)'
    - '"{country}" ("road safety" OR traffic OR "public transport" OR bus OR "EV charging" OR "electric vehicle" OR logistics OR autonomous OR cycling OR congestion)'
    - '"{country}" infrastructure (PPP OR loan OR budget OR investment OR ADB OR "World Bank" OR JICA OR AfDB OR concession OR tender OR contract)'
  fr_queries:
    - '"{country}" (route OR autoroute OR pont OR péage OR "sécurité routière" OR "transport urbain" OR bus OR infrastructures routières)'
  ja_queries:
    - '{country} (道路 OR 高速道路 OR 橋 OR 交通 OR 渋滞 OR ＥＶ OR 物流 OR 有料道路)'
  # 国名を含まない横断検索（日本語の専門媒体など）
  extra_queries:
    - {q: 'site:nna.jp (道路 OR 高速道路 OR 橋 OR 交通 OR ＥＶ OR 充電 OR 物流 OR 有料道路)', hl: ja, gl: JP}
    - {q: 'site:constructionreviewonline.com (road OR highway OR bridge OR expressway)', hl: en, gl: US}
    - {q: 'site:adb.org (road OR highway OR transport)', hl: en, gl: US}
    - {q: 'site:afdb.org (road OR highway OR corridor)', hl: en, gl: US}

# 媒体のRSSを直接読む（サンプル記事の出典を中心に。読めなかった媒体はログに出るだけで処理は続行）
