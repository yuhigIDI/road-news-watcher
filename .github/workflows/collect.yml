name: collect-monitor-articles

on:
  schedule:
    - cron: "17 21 * * *"   # 毎日 6:17（日本時間）
  workflow_dispatch:          # 手動実行ボタン

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 収集・分類・通知
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # MAIL_TO は渡さない＝6:17のメールは送らない（要約付きメールは mail.yml が送る）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VIEWER_URL: ${{ vars.VIEWER_URL }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '4' }}
          TRANSLATE: ${{ vars.TRANSLATE || 'off' }}
          # 元記事の本文を読んで判定・要約する（ANTHROPIC_API_KEY が必要。本文は保存しない）
          SUMMARIZE: ${{ vars.SUMMARIZE || 'on' }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
        run: python -m watcher
      - name: Excelを成果物として保存（30日）
        uses: actions/upload-artifact@v4
        with:
          name: monitor-articles-xlsx
          path: output/*.xlsx
          retention-days: 30
          if-no-files-found: ignore
      - name: データをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "collect: $(TZ=Asia/Tokyo date +%F)"
          git push
