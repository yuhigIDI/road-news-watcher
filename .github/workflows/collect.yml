name: collect-monitor-articles

on:
  schedule:
    - cron: "17 21 * * *"   # 毎日 6:17（日本時間）
  workflow_dispatch:          # 手動実行ボタン

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      # 定時実行が遅れて動いたとき、その日の収集がもう済んでいれば何もせずに終わる
      # （毎朝7:41のClaudeが先に手動で収集を動かすため。手動実行のときは常に収集する）
      - name: 今日の収集が済んでいるか確認
        id: guard
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && git log --format=%s | grep -qF "collect: $today"; then
            echo "今日（$today）の収集は済んでいるため、この定時実行は何もしません"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != 'true'
      - name: 収集・分類・通知
        if: steps.guard.outputs.skip != 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # MAIL_TO は渡さない＝6:17のメールは送らない（要約付きメールは mail.yml が送る）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VIEWER_URL: ${{ vars.VIEWER_URL }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '4' }}
          TRANSLATE: ${{ vars.TRANSLATE || 'off' }}
        run: python -m watcher
      - name: Excelを成果物として保存（30日）
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: monitor-articles-xlsx
          path: output/*.xlsx
          retention-days: 30
          if-no-files-found: ignore
      - name: データをコミット
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "collect: $(TZ=Asia/Tokyo date +%F)"
          git push
